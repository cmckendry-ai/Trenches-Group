# Deploy trenches-os-api from the repo. MANUAL TRIGGER ONLY until
# trenches-os-api/wrangler.jsonc declares the cron trigger, the EMAIL
# send_email binding, and the real queue/workflow names. Running it before
# then strips bindings from the live worker. See docs/DECISIONS.md.
#
# Needs repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts:Edit, D1:Edit,
# Queues:Edit, Workflows:Edit), CLOUDFLARE_ACCOUNT_ID.
name: deploy trenches-os-api
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trenches-os-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Refuse to deploy an unfinished config
        run: |
          if grep -q "TODO-confirm" wrangler.jsonc; then
            echo "wrangler.jsonc still has TODO-confirm placeholders. Fix them first."; exit 1; fi
          if ! grep -q '"send_email"' wrangler.jsonc; then
            echo "wrangler.jsonc does not declare the EMAIL send_email binding. Fix it first."; exit 1; fi
          if ! grep -q '"crons"' wrangler.jsonc; then
            echo "wrangler.jsonc does not declare the cron trigger. Fix it first."; exit 1; fi
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
