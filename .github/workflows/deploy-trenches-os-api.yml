# RETIRED 2026-10-22. trenches-os-api deploys from cmckendry-ai/trenches-hq
# (apps/trenches-os, TypeScript source) with /deploy trenches-os. The bundle in
# this repo is a recovered copy kept for reading, and deploying it would roll
# production back. This workflow is manual-only and refuses unless you type
# the confirmation input. See docs/DECISIONS.md, 2026-10-22.
#
# Repo secrets required (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   Workers Scripts:Edit, D1:Edit, Queues:Edit,
#                          Workflows:Edit, Email Routing:Edit
#   CLOUDFLARE_ACCOUNT_ID
name: deploy trenches-os-api
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type "trenches-hq is the source and I still want this" to proceed
        required: true
concurrency:
  group: deploy-trenches-os-api
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trenches-os-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Refuse unless explicitly confirmed
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "trenches-hq is the source and I still want this" ]; then
            echo "::error::This repo no longer deploys trenches-os-api. Use /deploy trenches-os in cmckendry-ai/trenches-hq."; exit 1; fi
      - name: Refuse to deploy an unfinished config
        run: |
          fail=0
          if grep -q "TODO-confirm" wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has TODO-confirm placeholders. Run scripts/pull-live-config.sh and fill them in."; fail=1; fi
          if ! grep -q '"send_email"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc does not declare the EMAIL send_email binding."; fail=1; fi
          if ! grep -q '"crons"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc does not declare the cron trigger."; fail=1; fi
          exit $fail
      - name: Show what would change
        run: npx wrangler deploy --dry-run --outdir=/tmp/dry
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
